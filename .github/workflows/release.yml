name: release

# Build cross-platform `trace` binaries (with the dashboard embedded) and publish
# them to a GitHub Release when a v* tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: trace-macos-arm64
            cross: false
          # Cross-compiled from an Apple Silicon host: Xcode's macOS SDK
          # supports x86_64-apple-darwin natively (no QEMU/cross needed),
          # and Intel-hosted (macos-13) runners have been badly congested.
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: trace-macos-x64
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: trace-linux-x64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: trace-linux-arm64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: trace-windows-x64.exe
            cross: false

    steps:
      - uses: actions/checkout@v4

      # --- Build the dashboard so it is embedded into the binary ---
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dashboard
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      # --- Rust toolchain ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # rust-embed embeds apps/web/dist in release builds.
      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p trace-cli

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p trace-cli

      # --- Stage the artifact + a SHA-256 checksum sidecar so `npm`/install.sh
      #     can verify the binary before trusting it. The `.sha256` file holds
      #     just the lowercase hex digest (no filename column), which is what
      #     the verifiers read.
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/trc" "dist/${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${{ matrix.artifact }}" | awk '{print $1}' > "dist/${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "dist/${{ matrix.artifact }}" | awk '{print $1}' > "dist/${{ matrix.artifact }}.sha256"
          fi
      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\trc.exe" "dist\${{ matrix.artifact }}"
          $hash = (Get-FileHash -Algorithm SHA256 "dist\${{ matrix.artifact }}").Hash.ToLower()
          Set-Content -NoNewline -Path "dist\${{ matrix.artifact }}.sha256" -Value $hash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

      # Publish each binary + its checksum to the Release as soon as it is built.
      # This makes the release resilient: a single platform stuck waiting for a
      # runner does not block the others from publishing. softprops upserts.
      - name: Publish asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  desktop-macos:
    name: build desktop shell (macOS, aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The desktop shell loads the daemon's own served dashboard at runtime,
      # but Tauri still bundles frontendDist, so build it first.
      - name: Build dashboard
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install desktop npm deps
        working-directory: apps/desktop
        run: npm install

      # Unsigned build — macOS will warn on first launch until
      # notarization/signing is added (see README "Engineering decisions").
      - name: Build desktop app bundle
        working-directory: apps/desktop
        run: npm run tauri build -- --target aarch64-apple-darwin

      # apps/desktop/src-tauri is a Cargo workspace member, so the build
      # output lands in the workspace-root target/ dir, not a nested
      # apps/desktop/src-tauri/target/ — this bit us the first time.
      - name: Stage bundle
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist/trace-desktop-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: trace-desktop-macos-arm64
          path: dist/trace-desktop-macos-arm64.dmg

      - name: Publish asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/trace-desktop-macos-arm64.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true

  desktop-windows:
    name: build desktop shell (Windows, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dashboard
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install desktop npm deps
        working-directory: apps/desktop
        run: npm install

      - name: Build desktop app bundle
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage bundle
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist/trace-desktop-windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: trace-desktop-windows-x64
          path: dist/trace-desktop-windows-x64-setup.exe

      - name: Publish asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/trace-desktop-windows-x64-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

  desktop-linux:
    name: build desktop shell (Linux, x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend is WebKitGTK — these are the runtime/dev
      # libraries it needs to compile and link against.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dashboard
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install desktop npm deps
        working-directory: apps/desktop
        run: npm install

      - name: Build desktop app bundle
        working-directory: apps/desktop
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles deb,appimage

      - name: Stage bundles
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb dist/trace-desktop-linux-x64.deb
          cp target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage dist/trace-desktop-linux-x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: trace-desktop-linux-x64
          path: |
            dist/trace-desktop-linux-x64.deb
            dist/trace-desktop-linux-x64.AppImage

      - name: Publish assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/trace-desktop-linux-x64.deb
            dist/trace-desktop-linux-x64.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
