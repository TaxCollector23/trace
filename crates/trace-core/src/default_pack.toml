# Trace rule pack — versioned, data-driven detection rules.
#
# This file ships embedded in the binary as the default pack. It can be
# overridden at runtime by pointing TRACE_RULES_PATH at a newer pack,
# which lets detection coverage improve WITHOUT shipping a new binary
# (the recurring-value "virus definitions" model).
#
# Bump `version` (calendar-versioned) whenever the rules change.

version = "2025.08.4"

# ---------------------------------------------------------------------------
# Prompt-injection / jailbreak phrases. Matched case-insensitively as
# substrings against a prompt during `harden`. These are instruction-hijack
# and evasion patterns an agent prompt should never contain silently.
# ---------------------------------------------------------------------------
injection_phrases = [
  "ignore previous instructions",
  "ignore all previous instructions",
  "ignore the above",
  "disregard the above",
  "disregard previous instructions",
  "forget your instructions",
  "forget all previous",
  "you are now",
  "act as if",
  "developer mode",
  "do anything now",
  "no restrictions",
  "without any restrictions",
  "bypass your",
  "bypass all",
  "reveal your system prompt",
  "print your instructions",
  "reveal your instructions",
  "do not tell the user",
  "don't tell the user",
  "without telling",
  "without asking for permission",
  "delete the logs",
  "hide this from",
  "exfiltrate",
  "send it to http",
  "upload the .env",
  "email the api key",
  "leak the",
]

# ---------------------------------------------------------------------------
# Supplemental command rules (substring, all-of match on the normalized,
# lowercased command). These are MERGED on top of the compiled built-in
# guard rules, so operators can extend coverage (e.g. a new CLI) without a
# code change. `decision` is one of: warn | require_approval | block.
# ---------------------------------------------------------------------------
[[command_rules]]
decision = "require_approval"
reason = "Helm uninstall removes a release and its resources."
all_of = ["helm", "uninstall"]

[[command_rules]]
decision = "require_approval"
reason = "flushdb/flushall erases a Redis datastore."
all_of = ["redis-cli", "flush"]

[[command_rules]]
decision = "block"
reason = "Overwriting the master boot record destroys the disk."
all_of = ["dd", "of=/dev/", "bs="]

# ---------------------------------------------------------------------------
# Supplemental secret patterns (regex). Merged on top of compiled built-ins.
# `keep` = leading chars retained before `...redacted`.
# ---------------------------------------------------------------------------
[[secret_patterns]]
secret_type = "digitalocean_token"
keep = 4
regex = "dop_v1_[a-f0-9]{64}"

[[secret_patterns]]
secret_type = "hashicorp_vault_token"
keep = 4
regex = "hvs\\.[A-Za-z0-9]{24,}"

# Modern AI-provider and webhook secrets — the coverage an agent-safety tool
# most needs current. Pure data: no binary rebuild required to add more.
[[secret_patterns]]
secret_type = "openrouter_key"
keep = 6
regex = "sk-or-v1-[a-f0-9]{48,}"

[[secret_patterns]]
secret_type = "huggingface_token"
keep = 4
regex = "hf_[A-Za-z0-9]{34,}"

[[secret_patterns]]
secret_type = "xai_key"
keep = 4
regex = "xai-[A-Za-z0-9]{60,}"

[[secret_patterns]]
secret_type = "perplexity_key"
keep = 4
regex = "pplx-[A-Za-z0-9]{40,}"

[[secret_patterns]]
secret_type = "replicate_token"
keep = 4
regex = "r8_[A-Za-z0-9]{37,}"

[[secret_patterns]]
secret_type = "google_oauth_token"
keep = 6
regex = "ya29\\.[A-Za-z0-9_-]{60,}"

[[secret_patterns]]
secret_type = "slack_webhook_url"
keep = 0
regex = "https://hooks\\.slack\\.com/services/[A-Za-z0-9/]{40,}"

[[secret_patterns]]
secret_type = "discord_webhook_url"
keep = 0
regex = "https://discord(?:app)?\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]{40,}"

# ---------------------------------------------------------------------------
# Data-driven policy rules (the "virus definitions" model for the deterministic
# policy engine). Each rule's `regex` is matched against the added (`+`-prefixed)
# lines of a file diff. `severity` is one of: low | medium | high. `skip_test_doc`
# defaults to true, matching the built-in checks that stay quiet on test/doc
# paths. Findings from these rules carry `source = "policy-pack"`.
#
# High-precision only: each regex requires a user-input marker (e.g. req.*) or an
# inline literal, so hardcoded-safe forms (env vars, constants) don't fire.
# ---------------------------------------------------------------------------

# Path traversal: a filesystem path built from request input, either containing
# a `../` segment next to `req.params|query|body`, or passed through
# `path.join(...)` with request input inside the join.
[[policy_rules]]
rule_key = "path-traversal"
title = "Path built from user input with traversal"
description = "A filesystem path is built from request input (path.join with req.*, or a ../ segment combined with req.params/query/body). An attacker can escape the intended directory — resolve and validate the path stays within an allow-listed root."
severity = "high"
regex = "(?i)path\\.join\\([^)\\n]*req\\.(?:params|query|body)|\\.\\./[^\\n]*req\\.(?:params|query|body)|req\\.(?:params|query|body)[^\\n]*\\.\\./"

# Hardcoded JWT secret: jwt.sign/verify handed an inline string literal as the
# key, or a `secret: "..."` assignment on a line that also mentions jwt.
[[policy_rules]]
rule_key = "hardcoded-jwt-secret"
title = "Hardcoded JWT signing secret"
description = "A JWT is signed/verified with an inline string secret (or a secret literal assigned near jwt). Hardcoded signing keys leak in source control and can't be rotated — load the secret from an environment variable or secrets manager."
severity = "high"
regex = "(?i)jwt\\.(?:sign|verify)\\s*\\([^)\\n]*,\\s*[\"'][^\"'\\n]{8,}[\"']|jwt[^\\n]*secret\\s*[:=]\\s*[\"'][^\"'\\n]{8,}|secret\\s*[:=]\\s*[\"'][^\"'\\n]{8,}[^\\n]*jwt"

# Open redirect: res.redirect() whose argument interpolates request input,
# letting an attacker craft a link that bounces the victim to any site.
[[policy_rules]]
rule_key = "open-redirect"
title = "Open redirect from user input"
description = "res.redirect() is passed a value derived from req.query/params/body. An attacker can supply an arbitrary destination and use your domain to phish — validate the target against an allow-list of internal paths."
severity = "medium"
regex = "(?i)res\\.redirect\\([^)\\n]*req\\.(?:query|params|body)"

# SSRF: a server-side fetch whose URL argument is built from request input.
# High precision: requires a user-input marker (req.query/params/body or a
# framework request object) inside the call — a fetch to a static string URL
# does not fire.
[[policy_rules]]
rule_key = "ssrf-risk"
title = "Server-side fetch to a URL built from user input"
description = "A server-side HTTP call (fetch/axios/requests/urllib) is given a URL derived from request input. An attacker can point it at internal metadata endpoints or intranet hosts (SSRF) — validate the target against an allow-list of hosts and reject non-public addresses."
severity = "high"
regex = "(?i)(?:fetch|axios\\.(?:get|post|put|delete)|requests\\.(?:get|post|put|delete)|urllib\\.request\\.urlopen)\\s*\\(\\s*[^)\\n]*(?:req\\.(?:query|params|body)|request\\.(?:args|form|json|values|GET|POST))"

# Weak randomness for a security value: Math.random()/random.random()/randint
# used on a line that also names a token/secret/otp/password. High precision: a
# plain Math.random() (jitter, sampling) with no security keyword does not fire.
[[policy_rules]]
rule_key = "weak-random-security"
title = "Security value built from weak randomness"
description = "A token, secret, OTP, or password is derived from Math.random()/random.random()/random.randint(), which are not cryptographically secure and are predictable. Use a CSPRNG (crypto.randomBytes / secrets module) for anything security-sensitive."
severity = "medium"
regex = "(?i)(?:Math\\.random\\s*\\(\\s*\\)|random\\.random\\s*\\(\\s*\\)|random\\.randint\\s*\\()[^\\n]*\\b(?:token|secret|otp|password|passwd|api[_-]?key|session[_-]?id)\\b|\\b(?:token|secret|otp|password|passwd|api[_-]?key|session[_-]?id)\\b[^\\n]*(?:Math\\.random\\s*\\(\\s*\\)|random\\.random\\s*\\(\\s*\\)|random\\.randint\\s*\\()"

# Insecure cookie flags: secure:false, httpOnly:false, or SameSite=None. High
# precision: a cookie set with secure:true, httpOnly:true does not fire.
[[policy_rules]]
rule_key = "insecure-cookie"
title = "Cookie set with insecure flags"
description = "A cookie is configured with secure:false, httpOnly:false, or SameSite=None, weakening its protection against interception or theft. Set secure:true and httpOnly:true, and avoid SameSite=None unless the cookie is also secure and cross-site by design."
severity = "medium"
regex = "(?i)secure\\s*:\\s*false|httponly\\s*:\\s*false|samesite\\s*:\\s*[\\x22\\x27]?none"

# Hardcoded database password: an inline quoted password literal on a line that
# also names a database/connection. High precision: `password: process.env.*`
# (no quoted literal) does not fire, and test/doc paths are skipped.
[[policy_rules]]
rule_key = "hardcoded-db-password"
title = "Hardcoded database password"
description = "A database connection is given an inline string password. Hardcoded credentials leak in source control and cannot be rotated — load the password from an environment variable or secrets manager."
severity = "high"
regex = "(?i)(?:password|passwd|pwd)\\s*[:=]\\s*[\\x22\\x27][^\\x22\\x27\\n]{6,}[\\x22\\x27][^\\n]*\\b(?:db|database|postgres|postgresql|mysql|mongodb|mongo|connection|conn|pool)\\b|\\b(?:db|database|postgres|postgresql|mysql|mongodb|mongo|connection|conn|pool)\\b[^\\n]*(?:password|passwd|pwd)\\s*[:=]\\s*[\\x22\\x27][^\\x22\\x27\\n]{6,}[\\x22\\x27]"

# Child process spawned with shell:true — turns argument arrays into a shell
# command line, re-opening command injection. High precision: shell:false (or no
# shell option) does not fire.
[[policy_rules]]
rule_key = "insecure-shell-spawn"
title = "Child process spawned with shell: true"
description = "spawn/execFile is called with { shell: true }, which runs the command through a shell and re-enables command injection via argument metacharacters. Drop the shell option (pass args as an array) or sanitize inputs against an allow-list."
severity = "medium"
regex = "(?i)\\b(?:spawn|spawnsync|execfile|execfilesync)\\s*\\([^\\n]*shell\\s*:\\s*true"
